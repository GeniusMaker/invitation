      - name: Update Manifests
        shell: python
        run: |
          import os
          import json
          import re

          def natural_sort_key(s):
              return [
                  int(text) if text.isdigit() else text.lower()
                  for text in re.split(r"(\d+)", s)
              ]

          def find_tags(obj):
              """Find all 'tags' arrays anywhere inside the JSON."""
              found_tags = []

              if isinstance(obj, dict):
                  for key, value in obj.items():

                      # Found a tags field
                      if key.lower() == "tags" and isinstance(value, list):
                          for tag in value:
                              if isinstance(tag, str):
                                  found_tags.append(tag)

                      # Continue searching nested data
                      found_tags.extend(find_tags(value))

              elif isinstance(obj, list):
                  for item in obj:
                      found_tags.extend(find_tags(item))

              return found_tags

          # Find Cards folder
          target_dir = None

          for item in os.listdir("."):
              if item.lower() == "cards" and os.path.isdir(item):
                  target_dir = item
                  break

          if target_dir:
              count = 0

              for root, dirs, files in os.walk(target_dir):

                  # Find JSON card files, excluding manifest.json
                  json_files = [
                      f for f in files
                      if f.lower().endswith(".json")
                      and f.lower() != "manifest.json"
                  ]

                  if not json_files:
                      continue

                  json_files.sort(key=natural_sort_key)

                  manifest_data = []

                  for jf in json_files:
                      file_path = os.path.join(root, jf)

                      try:
                          with open(
                              file_path,
                              "r",
                              encoding="utf-8"
                          ) as f:
                              data = json.load(f)

                          # Find tags anywhere in the JSON
                          tags = find_tags(data)

                          # Remove duplicate tags while preserving order
                          tags = list(dict.fromkeys(tags))

                          if tags:
                              manifest_data.append({
                                  "file": jf,
                                  "tags": tags
                              })

                              print(
                                  f"Found tags for {jf}: {tags}"
                              )
                          else:
                              manifest_data.append(jf)

                              print(
                                  f"No tags found for {jf}"
                              )

                      except Exception as e:
                          print(
                              f"Error reading {jf}: {e}"
                          )

                          # Keep the filename in manifest
                          manifest_data.append(jf)

                  # Write manifest.json
                  manifest_path = os.path.join(
                      root,
                      "manifest.json"
                  )

                  with open(
                      manifest_path,
                      "w",
                      encoding="utf-8"
                  ) as mf:
                      json.dump(
                          manifest_data,
                          mf,
                          indent=2,
                          ensure_ascii=False
                      )
                      mf.write("\n")

                  count += 1

                  print(
                      f"Successfully updated "
                      f"{manifest_path} with "
                      f"{len(json_files)} cards."
                  )

              print(
                  f"Total manifest files processed: {count}"
              )

          else:
              print("No Cards folder found!")
